name: tag-release

on:
  push:
    tags:
      - "v*.*.*"

# Keyless Google auth needs the GitHub OIDC token (id-token: write). Listing permissions replaces the
# repository default (write-all), so this keeps only what the steps use: checkout and the GitHub release.
permissions:
  contents: write  # marvinpinto/action-automatic-releases creates the GitHub release
  id-token: write

jobs:
  tagged-release:
    name: Tagged Release
    runs-on: "ubuntu-latest"

    steps:
      - name: Authenticate to Google Cloud (keyless)
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          # Keyless: terraform-gcp ci_images.tf (WIF; only covalenthq/ewm-das main and release tags may use it).
          workload_identity_provider: projects/238882278010/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: ewm-das-ci-image@covalent-project.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}
          # RETIRED 2026-11-23 (incident follow-up, no stored keys): username: _json_key, password: ${{ secrets.GCR_JSON_KEY }}

      - uses: actions/checkout@v2

      - name: Set env
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build & Publish the Docker image
        run: |
          docker buildx create --name builder --use --platform=linux/amd64  && docker buildx build --platform=linux/amd64 . -f Dockerfile.pinner -t us-docker.pkg.dev/covalent-project/network/ewm-das:stable -t us-docker.pkg.dev/covalent-project/network/ewm-das:"${{ env.TAG }}" --push

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          draft: false
          prerelease: false
          files: |
            *.zip
            *.tar.gz
